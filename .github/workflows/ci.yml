name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: uvx ruff check skills tests scripts
      - name: Validate SKILL.md
        run: uv run --with pyyaml python scripts/validate_skills.py
      - name: Offline tests
        run: uv run --with pytest --with "fal-client>=1.0,<2" --with httpx --with jsonschema pytest -q tests

  live:
    # One real ~$0.003 generation on main, only when the repository has a FAL_KEY secret.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Live smoke test
        if: env.FAL_KEY != ''
        run: FAL_LIVE=1 uv run --with pytest --with "fal-client>=1.0,<2" --with httpx --with jsonschema pytest -q tests -k live
